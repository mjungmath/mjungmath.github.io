title: Michael Jung
author:
  name: Michael Jung
  email: mjungmath (at) outlook (dot) com
description: > # this means to ignore newlines until "show_excerpts:"
  This is my personal homepage where I give insights into my ongoing work and ambitions.

show_excerpts: false # set to true to show excerpts on the homepage

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%a, %b %-d, %Y"
  skin: auto

  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/mjungmath"
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/michael-jung-194220413/"
    - title: ORCID
      icon: orcid
      url: "https://orcid.org/0009-0005-7309-0507"

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md

# Build settings
# theme: seminar
markdown: kramdown
kramdown:
   math_engine: mathjax

# include folders
include: ['_pages']

# events date format
seminar:
  event_date_format: "%a, %b %-d, %Y, %H:%M"

# seminar collection
collections:
  events:
    output: true
    permalink: /nutshell/:year/:month/:day/:name
    sort_by: dt_start

# set timezone
timezone: Europe/Amsterdam

plugins:
  - jekyll-feed
  - jekyll-seo-tag
